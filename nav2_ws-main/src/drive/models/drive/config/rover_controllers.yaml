controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    drive_controller:
      type: velocity_controllers/JointGroupVelocityController

    steer_controller:
      type: position_controllers/JointGroupPositionController

drive_controller:
  ros__parameters:
    joints:
      - joint_wheel_1
      - joint_wheel_2
      - joint_wheel_3
      - joint_wheel_4
      - joint_wheel_5
      - joint_wheel_6
    interface_name: velocity

steer_controller:
  ros__parameters:
    joints:
      - joint_right_front
      - joint_right_back
      - joint_left_front
      - joint_left_back
    interface_name: position

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    joints:  # Explicitly list all joints to broadcast
      - joint_right_front
      - joint_right_back
      - joint_left_front
      - joint_left_back
      - joint_right_bogie
      - joint_left_bogie
      - joint_wheel_1
      - joint_wheel_2
      - joint_wheel_3
      - joint_wheel_4
      - joint_wheel_5
      - joint_wheel_6
    interfaces:
      - position
      - velocity